<div class="modal" id="registrationModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Student Registration</h3>
            <span class="close" id="closeModal">&times;</span>
        </div>
        <div class="modal-body">

            <form class="registration-form" id="registrationForm" enctype="multipart/form-data">
                <!-- Honeypot – hidden from real users, bots fill it -->
                <div style="display:none" aria-hidden="true">
                    <label for="website">Leave this empty</label>
                    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                </div>

                <div class="form-section">
                    <h4>Personal Information</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" name="firstName" required maxlength="100">
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" name="lastName" required maxlength="100">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" required maxlength="254">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" name="phone" required minlength="6" maxlength="20">
                        </div>
                    </div>
                </div>

                <div class="form-section" id="academicSection">
                    <h4>Academic Information</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="university">University/Institution *</label>
                            <input type="text" id="university" name="university" required maxlength="200">
                        </div>
                        <div class="form-group">
                            <label for="field">Field of Study *</label>
                            <select id="field" name="field" required>
                                <option value="">Select your field</option>
                                <option value="pre-engineering">Pre engineering</option>
                                <option value="engineering">Engineering</option>
                                <option value="licence">Licence</option>
                                <option value="master">Master</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="level">Academic Level *</label>
                            <select id="level" name="level" required>
                                <option value="">Select your level</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                            </select>
                        </div>
                    </div>

                    <!-- CV link – students only -->
                    <div class="form-group" id="cvSection">
                        <label for="cv_url">Upload your CV in Google Drive and paste the shareable link here *</label>
                        <input type="url" id="cv_url" name="cv_url" placeholder="https://drive.google.com/..." required>
                        <small id="cvError" style="color:#ef4444;display:none;"></small>
                        <div class="form-group cv-consent-group" id="cvConsentGroup">
                            <label class="cv-consent-label" for="cv_consent">
                                <input class="cv-consent-checkbox" type="checkbox" id="cv_consent" name="cv_consent" value="true">
                                <span>I consent to MyPFE storing my CV link to share with partner companies for recruitment purposes.</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="cancelRegistration">Cancel</button>
                    <button type="submit" class="btn btn-primary">Complete Registration</button>
                </div>
            </form>
        </div>
    </div>
</div>
