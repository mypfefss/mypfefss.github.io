[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mypfe-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.37",
    "alembic>=1.14.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "pydantic-settings==2.6.1",
    "argon2-cffi==23.1.0",
    "PyJWT==2.10.1",
    "slowapi==0.1.9",
    "boto3==1.35.74",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.36.0",
    "python-multipart==0.0.12",
    "aiofiles==24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.0",
    "anyio==4.7.0",
    "aiosqlite==0.20.0",
    "pytest-cov==6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
app = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
